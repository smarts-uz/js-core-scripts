<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humanize — Homoglyph Replace</title>

  <body>
    <main class="container">
      <h1>Humanize — Homoglyph Replace</h1>
