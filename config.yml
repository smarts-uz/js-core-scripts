Contract:
    Prefix: RC
    Format: '{Prefix}-{ComName}-{Year}-{Month}-{Day}'
    PrepayMonth: 1
    PdfFormatCode: 17
    ComDateIjara: 31.12.2029
    AddDays: 363
    DefaultBank: SRental-Kapital
    DefaultTariff: 1-450k
CmdLine:
    ExitTimeout: 3000
    ExitTimeoutError: 30000
    TryCatch: false
Cache:
    Directory: c:\Cache
    FetchTimeout: 100
# Secrets (My3Api, My3, Kapital, KapitalId, Didox, Ijara) moved to .env — read
# via process.env (dotenv). See INTEGRATIONS.md for the variable names.
# The non-secret Didox partner-API base URL stays here.
Didox:
    BaseURL: api-partners.didox.uz
Templates:
    WordMerge: d:\FileType\Office\Projects\DOCX\Merge\
    # Folders (not files). At runtime the latest "Basename N" file is picked from each.
    WordMd: d:\FileType\Office\Projects\DOCX\MD\
    WordMdTOC: d:\FileType\Office\Projects\DOCX\MD-TOC\
    WordMdRule: d:\FileType\Office\Projects\DOCX\MD-Rule\
    # Contract templates (files) — read by Word.makeContract / Yamls / Excels.generate.
    Word: d:\Humans\Building\Rentalls\Contract\Projects\Rentals 527.docx
    Yaml: C:\Users\Administrator\.agents\skills\smarts-firm-docums\templa\ALL.contract
    Excel: d:\Humans\Building\Rentalls\ActReco\Projects\Act 99.xlsx
ChoosedChars:
    Word: cxACEHIJKMOPSTX
    Markdown: cxACEHIJKMOPSTX
    Excel: cxACEHIJKMOPSTX
    PowerPoint: cxACEHIJKMOPSTX
Scanner:
    Exclusions:
        - ALL
        - App
        - Asp
        - Asv
        - Azk
        - Services
        - Element
        - Projects
        - '- Theory'
        - AIC
        - Formula
        - Durdona
        - MsExcel
        - RealStat
        - Sample
        - Samples
Penalty:
    # Contract §21.2/§21.3 late rent-payment penalty (пеня/неустойка):
    # for each month with outstanding Loaners (underpaid/unpaid), the penalty
    # is immediately CapRatio of that month's own (PriceMax-adjusted) Accrual
    # figure — no daily accrual/settle-date tracking. Read by Yamls.replaceYaml.
    PerDay: 50000
    CapRatio: 0.5
Excel:
    ProtectSuffix: ' PR'
    # Contract pricing cell/column names, in order — read by Excels.generate
    # (formerly the standalone Excel.txt).
    CellNames:
        - Trans-OT
        - Bank-OT
        - Bank-IN
        - EHF-IN
        - Card-OT
        - Card-IN
        - Bonuses
        - BaaR-OT
        - BaaR-IN
    ExcludedSheets:
        - Results
        - Lookup
        - ALL
        - App
        - Stroop
        - TMT
        - DST
        - LMWT
        - NS
        - EEG
        - Audio

Markdown:
    LineBetween: 20

Registry:
    clean:
        Hives: Both # which environment hive(s) to clean Path / Path_* in. Possible: System | User | Both
        Backup: true # export both env keys to %USERPROFILE%\registry-path-backup-<timestamp> before changing. Possible: true | false
        Broadcast: true # notify running apps of the change via WM_SETTINGCHANGE (no reboot needed). Possible: true | false
