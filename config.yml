Contract:
    Prefix: RC
    Format: '{Prefix}-{ComName}-{Year}-{Month}-{Day}'
    PrepayMonth: 1
    PdfFormatCode: 17
    # YYYY-MM-DD, like every contract date key in ALL.contract.
    ComDateIjara: 2029-12-31
    AddDays: 363
    DefaultBank: SRental-Kapital
    DefaultTariff: 1-450k
CmdLine:
    ExitTimeout: 3000
    ExitTimeoutError: 30000
    TryCatch: false
Cache:
    Directory: c:\Cache
    FetchTimeout: 100
# Secrets (My3Api, My3, Kapital, KapitalId, Didox, Ijara) moved to .env — read
# via process.env (dotenv). See INTEGRATIONS.md for the variable names.
# The non-secret Didox partner-API base URL stays here.
Didox:
    BaseURL: api-partners.didox.uz
Templates:
    WordMerge: d:\FileType\Office\Projects\DOCX\Merge\
    # Folders (not files). At runtime the latest "Basename N" file is picked from each.
    WordMd: d:\FileType\Office\Projects\DOCX\MD\
    WordMdTOC: d:\FileType\Office\Projects\DOCX\MD-TOC\
    WordMdRule: d:\FileType\Office\Projects\DOCX\MD-Rule\
    # Contract template folders — read by Word.makeContract / Excels.generate.
    # Folders (not files). At runtime the latest "Basename N" file is picked from each via Files.getLatestMatchingFile.
    Word: d:\Humans\Building\Rentalls\Contract\Projects\
    Excel: d:\Humans\Building\Rentalls\ActReco\Projects\
    # Yaml stays a fixed file — smarts-firm-docums's own single template, not increment-versioned.
    Yaml: C:\Users\Administrator\.agents\skills\smarts-firm-docums\templa\ALL.contract
ChoosedChars:
    Word: cxACEHIJKMOPSTX
    Markdown: cxACEHIJKMOPSTX
    Excel: cxACEHIJKMOPSTX
    PowerPoint: cxACEHIJKMOPSTX
Scanner:
    Exclusions:
        - ALL
        - App
        - Asp
        - Asv
        - Azk
        - Services
        - Element
        - Projects
        - '- Theory'
        - AIC
        - Formula
        - Durdona
        - MsExcel
        - RealStat
        - Sample
        - Samples
Penalty:
    # Contract §21.1 late rent-payment penalty (пеня/неустойка): a fixed
    # PerDay amount for every calendar day (beyond the 1-day grace period
    # of §3.7/§1.20) the client's running prepaid balance stays negative —
    # PenaltyDays[month] * PerDay = Penalty[month], no cap, no CapRatio.
    # Read by Yamls.replaceYaml (computeDailyBalance/computePenaltyDays/
    # computePenalty). CapRatio retired — the old %-of-Accrual model no
    # longer applies.
    PerDay: 50000
Excel:
    ProtectSuffix: ' PR'
    # Contract pricing cell/column names, in order — read by Excels.generate
    # (formerly the standalone Excel.txt).
    CellNames:
        - Trans-OT
        - Bank-OT
        - Bank-IN
        - EHF-IN
        - Card-OT
        - Card-IN
        - Bonuses
        - BaaR-OT
        - BaaR-IN
    ExcludedSheets:
        - Results
        - Lookup
        - ALL
        - App
        - Stroop
        - TMT
        - DST
        - LMWT
        - NS
        - EEG
        - Audio

Markdown:
    LineBetween: 20

Registry:
    clean:
        Hives: Both # which environment hive(s) to clean Path / Path_* in. Possible: System | User | Both
        Backup: true # export both env keys to %USERPROFILE%\registry-path-backup-<timestamp> before changing. Possible: true | false
        Broadcast: true # notify running apps of the change via WM_SETTINGCHANGE (no reboot needed). Possible: true | false

Testing:
    # Real, live .contract files kept as standing regression targets — every
    # code change to the contract-fill/Word/Excel-generation pipeline
    # (Yamls.fillYamlWithInfo, Word.makeContract, Excels.generate, and the
    # Accrual/Payment/Faktura/Loaners/PenaltyON/Penalty chain) is verified for
    # real against BOTH of these before being considered done — one YaTT
    # (sole proprietor, PINFL-only) and one MChJ (ordinary company, TIN-based)
    # contract, so a fix that only works for one legal form is caught.
    ContractFiles:
        - d:\FSystem\ALL\Humans\Rentalls\Perfects\ASHALIFE PHARMA\ALL.contract
        - d:\FSystem\ALL\Humans\Founder\YaTT RYABSEV OLEG VLADIMIROVICH\ALL.contract
